name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, bundle: dmg, name: macos-arm64, path: 'src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg' }
          - { os: macos-latest, target: x86_64-apple-darwin, bundle: dmg, name: macos-x64, path: 'src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundle: nsis, name: windows-x64-setup, path: 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, bundle: nsis, name: windows-arm64-setup, path: 'src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Test
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      # One artifact per installer file, so each can be downloaded on its own.
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-keeper-${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
