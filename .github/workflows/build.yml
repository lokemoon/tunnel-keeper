name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            platform: macos
            ext: dmg
          - os: windows-latest
            script: dist:win
            platform: windows
            ext: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # One artifact per chip, matching the per-chip installers.
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-keeper-${{ matrix.platform }}-arm64
          path: dist/*-arm64*.${{ matrix.ext }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-keeper-${{ matrix.platform }}-x64
          path: dist/*-x64*.${{ matrix.ext }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
